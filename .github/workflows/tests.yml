name: Tests

# The full suite on every push and pull request, so a branch is tested before it reaches dev or
# main, not only on the machine that cuts a release.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every Python pyproject.toml lists, from the oldest it accepts.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # The apt OpenOCD: the OSS CAD Suite's own build, first on PATH, has no dummy adapter,
      # which the SVF checks run on.
      WARPTAP_OPENOCD_CMD: /usr/bin/openocd
      # faultflow and autoMBIST, checked out below, for the cross-checks that need them.
      # Tracking their development branches is on purpose: warptap ports faultflow's models
      # and both pin warptap, so drift should show up here first.
      WARPTAP_FAULTFLOW_DIR: ${{ github.workspace }}/siblings/faultflow
      WARPTAP_OPENMBIST_DIR: ${{ github.workspace }}/siblings/autoMBIST
      # alexforencich/verilog-uart (MIT), pinned: a second real design, for uart_tx's RTL and
      # gate-level cross-sims.
      WARPTAP_VERILOG_UART_DIR: ${{ github.workspace }}/siblings/verilog-uart
      # IHP SG13G2's standard-cell liberty and Verilog models, for the gate-level checks.
      WARPTAP_IHP_STDCELL_DIR: ${{ github.workspace }}/siblings/sg13g2_stdcell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/icl_parser: its tests fail, not skip, without it
      - uses: actions/checkout@v4
        with:
          repository: ranaumarnadeem/faultflow
          ref: dev
          path: siblings/faultflow
      - uses: actions/checkout@v4
        with:
          repository: ranaumarnadeem/autoMBIST
          path: siblings/autoMBIST
      - uses: actions/checkout@v4
        with:
          repository: alexforencich/verilog-uart
          ref: 1b867e53af738e4a8bc7c839ca2f1c07f40382dc
          path: siblings/verilog-uart
      # The ITC'16 IJTAG benchmark set, for tests/test_icl_import_itc16.py: the parser author's
      # Fixes branch, pinned (the test's table is for that commit). It is not vendored, having no
      # license. One Python version is enough, and its largest networks take minutes to parse.
      - name: Check out the ITC'16 benchmark set
        if: matrix.python-version == '3.12'
        run: |
          git clone --quiet --branch Fixes https://gitlab.com/Honza255/benchmarks.git siblings/itc16
          git -C siblings/itc16 checkout --quiet f4578a8e157ddd46e81a29ca684965490b0fdfa8
          echo "WARPTAP_ITC16_DIR=$GITHUB_WORKSPACE/siblings/itc16" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Native Yosys and Icarus Verilog. The dev extra's yowasp-yosys is not enough: faultflow's
      # netlist generation, which the compaction and continuous-decompressor cross-sims call,
      # runs `yosys` by name on absolute paths, which the WebAssembly build cannot open.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install OpenOCD
        run: sudo apt-get update && sudo apt-get install -y openocd
      - name: Install warptap with its dev extra
        # jinja2: autoMBIST's generator, imported from its checkout by the design tests.
        run: python -m pip install -e ".[dev]" jinja2
      - name: Fetch the IHP SG13G2 standard cells
        # Five files at a pinned IHP-Open-PDK commit, each checked against its git blob SHA
        # (tests/gate_level.py holds both).
        run: python tests/gate_level.py fetch "$WARPTAP_IHP_STDCELL_DIR"
      - name: Run the test suite
        # -rs lists every skip and why. The Jam STAPL player is not built here, so its 3 tests
        # skip, and OpenSTA isn't either, so the STA tests skip: building it from source here
        # would take longer than the suite itself (see docs/guide/gate-level.md). The ITC'16
        # tests skip except on 3.12, the one version the set is checked out for.
        run: python -m pytest -q -rs

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: mkdocs build --strict
