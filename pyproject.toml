[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warptap"
version = "0.0.6"
description = "Insert IEEE 1149.1 (JTAG/TAP) and IEEE 1687 (IJTAG/ICL+PDL) test-access infrastructure into a design"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rana Umar Nadeem", email = "rana.umar.nadeem21@gmail.com" }]
keywords = [
    "jtag", "ijtag", "boundary-scan", "ieee-1149.1", "ieee-1687",
    "icl", "pdl", "dft", "test-access", "svf", "stapl", "stil",
    "design-for-test", "tap-controller", "eda", "verilog", "open-source-hardware",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
# import_icl/import_pdl: the parser warptap ships (warptap/_vendor) was generated with ANTLR
# 4.13.2, and generated code needs a runtime of the same minor version.
import = ["antlr4-python3-runtime>=4.13.2,<4.14"]
dev = [
    "pytest>=8",
    "yowasp-yosys",
    # third_party/icl_parser's own imports, its retargeting model's included; its generated
    # parsers were produced by ANTLR 4.13.2.
    "antlr4-python3-runtime==4.13.2",
    "z3-solver",
    "sympy",
    "networkx",
    # STIL checks: Semi-ATE-STIL parses, and its dump compiler feeds tests/stil_replay.py.
    # It does not declare lark, which it imports.
    "Semi-ATE-STIL==0.3.2",
    "lark",
    # The openMBIST (autoMBIST) design tests write their memory configs as YAML.
    "pyyaml",
    # An independent check of the full BSDL: ebyst reads it and drives the inserted RTL
    # (tests/test_bsdl_ebyst.py). It needs Python 3.13; on older ones those tests skip.
    "ebyst==0.6.0; python_version >= '3.13'",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=1.0"]

[project.urls]
Homepage = "https://github.com/ranaumarnadeem/warptap"
Documentation = "https://ranaumarnadeem.github.io/warptap/"
Repository = "https://github.com/ranaumarnadeem/warptap"
Changelog = "https://github.com/ranaumarnadeem/warptap/blob/main/CHANGELOG.md"

[project.scripts]
warptap = "warptap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warptap = ["rtl/*.v", "py.typed", "_vendor/icl_parser/LICENSE", "_vendor/icl_parser/SOURCE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
